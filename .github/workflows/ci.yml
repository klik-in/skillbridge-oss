name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: skillbridge
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U skillbridge -d skillbridge"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.1 fmt --check
      - run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.99.1 test --locked
      - run: cargo +1.99.1 test --locked -- --ignored
        env:
          DATABASE_URL: postgres://skillbridge:ci_ephemeral_password@127.0.0.1:${{ job.services.db.ports['5432'] }}/skillbridge

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci_ephemeral_compose_password
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Create synthetic test accounts
        shell: bash
        run: |
          demo="$(docker compose run --rm -T api demo)"
          teacher="$(awk '$1 == "guru@example.test" { print $2 }' <<< "$demo")"
          student="$(awk '$1 == "siswa@example.test" { print $2 }' <<< "$demo")"
          test -n "$teacher"
          test -n "$student"
          echo "::add-mask::$teacher"
          echo "::add-mask::$student"
          printf 'SKILLBRIDGE_TEACHER_PASSWORD=%s\nSKILLBRIDGE_STUDENT_PASSWORD=%s\n' "$teacher" "$student" >> "$GITHUB_ENV"
      - working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
